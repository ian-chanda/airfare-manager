
[package]
name = "airfare-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
num-format = "0.4"
egui_extras = { version = "0.34", features = ["image"] }
image = { version = "0.25", features = ["png"] }
bcrypt = "0.18"
eframe = "0.34"
egui = "0.34"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
dotenvy = "0.15"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
